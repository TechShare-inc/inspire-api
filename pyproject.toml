[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspire-api"
version = "1.0.0"
description = "Python interface for controlling the Inspire Hand robotic hand via serial and Modbus TCP"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TechShare Inc.", email = "contact@techshare.com"}
]
keywords = ["robotics", "inspire-hand", "modbus", "serial", "robotic-hand"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyserial>=3.5",
    "loguru>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/TechShare-inc/inspire-api"
Repository = "https://github.com/TechShare-inc/inspire-api"
Documentation = "https://github.com/TechShare-inc/inspire-api#readme"
Issues = "https://github.com/TechShare-inc/inspire-api/issues"

[project.optional-dependencies]
modbus = [
    "pymodbus>=3.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inspire_api*"]
exclude = ["tests*", "examples*"]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src/inspire_api",
    "--cov-report=term-missing",
    "--cov-report=html",
]
